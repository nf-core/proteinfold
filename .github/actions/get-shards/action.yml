name: "Get number of shards"
description: "Get the number of nf-test shards for the current CI job"
inputs:
  max_shards:
    description: "Maximum number of shards allowed"
    required: true
  paths:
    description: "Component paths to test"
    required: false
  tags:
    description: "Tags to pass as argument for nf-test --tag parameter"
    required: false
  group_by_image:
    description: "Use one image-affinity matrix entry per selected tag"
    required: false
    default: "false"
outputs:
  shard:
    description: "Array of shard numbers"
    value: ${{ steps.shards.outputs.shard }}
  total_shards:
    description: "Total number of shards"
    value: ${{ steps.shards.outputs.total_shards }}
  matrix:
    description: "Image-affinity matrix entries"
    value: ${{ steps.shards.outputs.matrix }}
runs:
  using: "composite"
  steps:
    - name: Install nf-test
      uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
      with:
        version: ${{ env.NFT_VER }}
    - name: Get number of shards
      id: shards
      shell: bash
      run: |
        shard="[]"
        total_shards=0
        matrix="[]"

        run_dry() {
          args=(--profile +docker --dry-run --ci --changed-since HEAD^)
          if [[ -n "$1" ]]; then args+=(--tag "$1"); fi
          if [[ -n "${2:-}" ]]; then args+=(--csv "$2"); fi
          nf-test test "${args[@]}"
        }
        count_tests() {
          sed -n 's|.*Executed \([0-9]*\) tests.*|\1|p' | tail -1
        }

        if [[ "${{ inputs.group_by_image }}" == "true" ]]; then
          reports="$RUNNER_TEMP/nf-test-image-groups"
          mkdir -p "$reports"
          selected_output=$(run_dry '' "$reports/all.csv") || { echo "nf-test dry-run failed"; exit 1; }
          selected_count=$(printf '%s\n' "$selected_output" | count_tests)
          if (( ${selected_count:-0} > 0 )) && [[ ! -f "$reports/all.csv" ]]; then
            echo "nf-test selected tests but did not write a CSV report"
            exit 1
          fi
          matrix=$(python - "$reports/all.csv" "${{ inputs.max_shards }}" <<'PY'
        import csv
        import json
        import os
        import re
        import sys

        files = set()
        if os.path.exists(sys.argv[1]):
            with open(sys.argv[1], newline='') as handle:
                files = {row['filename'] for row in csv.DictReader(handle)}
        tags = set()
        for filename in files:
            with open(filename) as handle:
                matches = re.findall(r'^    tag "(ci_img_[^"]+)"\s*$', handle.read(), re.MULTILINE)
            if len(matches) != 1:
                print('::warning::Image tags missing or ambiguous; running all tests together', file=sys.stderr)
                print('[{"tag":"","label":"1/1 | all"}]')
                sys.exit(0)
            tags.add(matches[0])
        if len(tags) > int(sys.argv[2]):
            print('::warning::Image groups exceed max_shards; running all tests together', file=sys.stderr)
            print('[{"tag":"","label":"1/1 | all"}]')
            sys.exit(0)
        names = sorted(tags)
        matrix = [{'tag': tag, 'label': f'{index}/{len(names)} | {tag.removeprefix("ci_img_")}'}
                  for index, tag in enumerate(names, 1)]
        print(json.dumps(matrix, separators=(',', ':')))
        PY
          ) || { echo "Cannot assign image groups"; exit 1; }
          shard='["1"]'
          total_shards=$(jq length <<< "$matrix")
        else
          nftest_output=$(run_dry "${{ inputs.tags }}") || { echo "nf-test command failed"; exit 1; }
          number_of_shards=$(printf '%s\n' "$nftest_output" | count_tests)
          if [[ -n "$number_of_shards" && "$number_of_shards" -gt 0 ]]; then
            shards_to_run=$(( number_of_shards < ${{ inputs.max_shards }} ? number_of_shards : ${{ inputs.max_shards }} ))
            shard=$(seq 1 "$shards_to_run" | jq -R . | jq -c -s .)
            total_shards="$shards_to_run"
          fi
        fi

        # Write to GitHub Actions outputs
        echo "shard=$shard" >> $GITHUB_OUTPUT
        echo "total_shards=$total_shards" >> $GITHUB_OUTPUT
        echo "matrix=$matrix" >> $GITHUB_OUTPUT

        # Debugging output
        echo "Final shard array: $shard"
        echo "Total number of shards: $total_shards"
