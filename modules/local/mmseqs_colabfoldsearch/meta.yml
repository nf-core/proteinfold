name: "mmseqs_colabfoldsearch"
description: Search ColabFold sequence databases with MMseqs2 and produce MSA and AF3-compatible JSON results.
tools: []
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - fasta:
        type: file
        description: Protein FASTA query input.
        pattern: "*.{fa,fasta}"
    - db:
        type: directory
        description: ColabFold sequence database files staged under db.
    - uniref30:
        type: directory
        description: UniRef30 database files staged under uniref30.
output:
  a3m:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "**.a3m":
          type: file
          description: Multiple sequence alignment files generated by ColabFold search.
          pattern: "*.a3m"
  json:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "**.json":
          type: file
          description: AF3-compatible JSON search results.
          pattern: "*.json"
  versions_colabfold_search:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - colabfold_search:
          type: string
          description: The tool name.
      - 'pip list | grep "^colabfold" | awk ''{print $2}'' 2>/dev/null || echo "unknown"':
          type: eval
          description: The expression to obtain the ColabFold version.
  versions_mmseqs:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - mmseqs:
          type: string
          description: The tool name.
      - "mmseqs version":
          type: eval
          description: The expression to obtain the MMseqs2 version.
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - colabfold_search:
          type: string
          description: The tool name.
      - 'pip list | grep "^colabfold" | awk ''{print $2}'' 2>/dev/null || echo "unknown"':
          type: eval
          description: The expression to obtain the ColabFold version.
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - mmseqs:
          type: string
          description: The tool name.
      - "mmseqs version":
          type: eval
          description: The expression to obtain the MMseqs2 version.
