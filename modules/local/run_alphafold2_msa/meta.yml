name: "run_alphafold2_msa"
description: Run the AlphaFold2 multiple-sequence-alignment pipeline.
tools: []
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information.
    - fasta:
        type: file
        description: Protein FASTA input.
        pattern: "*.{fa,fasta}"
    - alphafold2_model_preset:
        type: string
        description: AlphaFold2 model preset, such as monomer or multimer.
  - db_preset:
      type: boolean
      description: Whether to use the full database preset.
  - uniref30_prefix:
      type: string
      description: Prefix of the UniRef30 database files.
  - params:
      type: directory
      description: AlphaFold2 parameter files.
      pattern: "params/*"
  - bfd:
      type: directory
      description: BFD database files.
      pattern: "bfd/*"
  - small_bfd:
      type: directory
      description: Small BFD database files.
      pattern: "small_bfd/*"
  - mgnify:
      type: directory
      description: MGnify database files.
      pattern: "mgnify/*"
  - pdb70:
      type: directory
      description: PDB70 database files.
      pattern: "pdb70/*"
  - pdb_mmcif:
      type: directory
      description: PDB mmCIF database files and obsolete-entry data.
      pattern: "pdb_mmcif/*"
  - uniref30:
      type: directory
      description: UniRef30 database files.
      pattern: "uniref30/*"
  - uniref90:
      type: directory
      description: UniRef90 database files.
      pattern: "uniref90/*"
  - pdb_seqres:
      type: directory
      description: PDB sequence-resolution database files.
      pattern: "pdb_seqres/*"
  - uniprot:
      type: directory
      description: UniProt database files.
      pattern: "uniprot/*"
output:
  raw:
    - "raw/**":
        type: file
        description: Raw AlphaFold2 MSA outputs.
  features:
    - - meta:
          type: map
          description: Groovy Map containing sample information.
      - "raw/features.pkl":
          type: file
          description: AlphaFold2 MSA features pickle.
  versions_python:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - python:
          type: string
          description: The tool name.
      - 'python3 --version 2>/dev/null | sed ''s/Python //g'' || echo "unknown"':
          type: eval
          description: The expression to obtain the version of the tool.
  versions_alphafold2:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - alphafold2:
          type: string
          description: The tool name.
      - 'cd /app/alphafold && git rev-parse HEAD 2>/dev/null || echo "unknown"':
          type: eval
          description: The expression to obtain the version of the tool.
  versions_numpy:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - numpy:
          type: string
          description: The tool name.
      - 'python3 -c "import numpy; print(numpy.__version__)" 2>/dev/null || echo "unknown"':
          type: eval
          description: The expression to obtain the version of the tool.
  versions_biopython:
    - - "${task.process}":
          type: string
          description: The process the versions were collected from.
      - biopython:
          type: string
          description: The tool name.
      - 'python3 -c "import Bio; print(Bio.__version__)" 2>/dev/null || echo "unknown"':
          type: eval
          description: The expression to obtain the version of the tool.
topics:
